<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de meta - VITA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/vita.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 20px; }
        .card-shadow { box-shadow: 0 15px 35px -10px rgba(0,0,0,0.05); }
        .progress-fill { transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .check-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen gap-4">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Componente · coherente con goals-page (Nivel 2 · 850 XP · 66% nivel)</p>

    <a href="goal-detail.html" class="bg-white rounded-[2rem] p-6 w-full max-w-sm card-shadow border border-slate-50 block hover:shadow-lg transition-shadow">
        
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-indigo-100">
                    🎯
                </div>
                <div>
                    <h2 class="text-slate-800 font-extrabold text-lg leading-tight">Líder Inmobiliario</h2>
                    <div class="flex gap-2 mt-1">
                        <span class="text-indigo-500 font-bold text-[10px] uppercase tracking-widest">#Trabajo</span>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-3 py-1 rounded-full border border-slate-100 flex items-center gap-2">
                <span class="text-slate-500 font-bold text-[11px] uppercase">Nivel 2</span>
                <span class="text-amber-600 font-bold text-[11px]">850 XP</span>
            </div>
        </div>

        <div class="mb-1 flex justify-between text-xs font-bold text-slate-500">
            <span>Progreso Nivel 2</span><span>66%</span>
        </div>
        <div class="mb-6">
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-50">
                <div class="progress-fill bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full" style="width: 66%"></div>
            </div>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 flex items-center justify-between group cursor-pointer hover:bg-slate-100 transition-colors border border-slate-100/50">
            <div class="pr-4">
                <span class="text-slate-400 text-[10px] font-bold uppercase block mb-0.5">Siguiente acción</span>

                    Investigar tendencias inmobiliarias en TikTok
                </p>
                <p class="text-[11px] text-indigo-600 font-bold mt-1">+125 XP · Nivel 2</p>
            </div>
            
            <button class="check-btn min-w-[32px] h-8 w-8 rounded-full border-2 border-indigo-200 flex items-center justify-center text-transparent hover:border-indigo-500 hover:text-indigo-500 transition-all bg-white shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <div class="flex gap-2 mt-4 opacity-60">
             <span class="text-slate-400 text-[10px] font-bold italic tracking-wide">66% = progreso del Nivel 2 · Global 38% en <span class="underline">goal-detail</span> →</span>
        </div>

    </a>

</html>
